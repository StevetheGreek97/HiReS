name: Publish

# Builds the distributions and uploads them to PyPI when a GitHub release is
# published. Uses PyPI trusted publishing: no token is stored in the
# repository. One-time setup on https://pypi.org/manage/project/hireseg/settings/publishing/
# -> add a GitHub publisher with workflow "publish.yml" and environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
