site_name: HiReS
site_description: Tiled instance segmentation and morphometric analysis of high-resolution images
site_url: https://stevethegreek97.github.io/HiReS/
site_author: Stylianos Mavrianos
repo_url: https://github.com/StevetheGreek97/HiReS
repo_name: StevetheGreek97/HiReS
edit_uri: edit/main/docs/
copyright: Copyright &copy; Stylianos Mavrianos. Released under the MIT License.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

use_directory_urls: false

watch:
  - hires
  - tools

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Migrating from 1.x: getting-started/migration.md
  - User guide:
      - user-guide/index.md
      - The data model: user-guide/data-model.md
      - Reading and writing: user-guide/io.md
      - Tiled segmentation: user-guide/segmentation.md
      - Morphometric traits: user-guide/morphometrics.md
      - Filtering and class handling: user-guide/filtering.md
      - Evaluation: user-guide/evaluation.md
      - Visualisation: user-guide/plotting.md
      - Tiling training data: user-guide/tiling.md
      - Errors, warnings and logging: user-guide/diagnostics.md
  - Reference:
      - reference/index.md
      - Python API:
          - hires.Annotation: reference/annotation.md
          - hires.Collection: reference/collection.md
          - hires.Album: reference/album.md
          - Input and output: reference/io.md
          - Segmentation: reference/segmentation.md
          - Measurement: reference/measurement.md
          - Class handling: reference/classes.md
          - Evaluation (hires.metrics): reference/metrics.md
          - Plotting (hires.plot): reference/plot.md
          - Tiling (hires.tiling): reference/tiling.md
          - Trait agreement (hires.analysis): reference/analysis.md
          - Exceptions and warnings: reference/errors.md
      - Command line:
          - The hires command: reference/cli.md
          - Output files: reference/outputs.md
  - Development:
      - Contributing: development/contributing.md
      - Release notes: development/release-notes.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://shapely.readthedocs.io/en/stable/objects.inv
            - https://matplotlib.org/stable/objects.inv
          options:
            extensions:
              - tools/griffe_rst.py:RstToMarkdown
            docstring_style: numpy
            docstring_section_style: table
            heading_level: 3
            show_root_heading: true
            show_root_full_path: true
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_bases: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 88
            merge_init_into_class: true
            members_order: source
            inherited_members: false
            summary: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
