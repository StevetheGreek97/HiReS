site_name: HiReS
site_description: Automated Morphometric Trait Extraction from High-Resolution Plankton Images
site_url: https://stevethegreek97.github.io/HiReS/
repo_url: https://github.com/StevetheGreek97/HiReS
repo_name: StevetheGreek97/HiReS

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy

use_directory_urls: false

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User Guide:
      - Command-Line Interface: cli.md
      - Python API: api.md
  - How It Works:
      - Pipeline: pipeline.md
      - Morphometric Descriptors: morphometrics.md
  - Reference:
      - Configuration: configuration.md
      - Output Files: outputs.md
      - Data Models: models.md
      - Evaluation: evaluation.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css: []
