site_name: HiReS
site_description: High-Resolution Image Segmentation and Analysis Pipeline
site_url: https://stevethegreek97.github.io/HiReS/
repo_url: https://github.com/StevetheGreek97/HiReS
repo_name: StevetheGreek97/HiReS

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Usage:
      - CLI Reference: cli.md
      - Python API: api.md
      - Configuration: configuration.md
  - Internals:
      - Pipeline Architecture: pipeline.md
      - Data Models: models.md
      - Evaluation: evaluation.md
  - Outputs: outputs.md

use_directory_urls: false

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
