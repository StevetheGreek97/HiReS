[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hires"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
hires = "hires.cli:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = [".venv*", "test*"]

[tool.setuptools.package-data]
hires = ["py.typed"]
